name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Backend contracts (actual local HTTP)
        run: python -m unittest discover -s tests -v
      - name: Agent and native approval boundaries (fake transport/model)
        run: python -m unittest discover -s tests_agents -v
