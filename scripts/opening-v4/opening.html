<!doctype html>
<html><head><meta charset="utf-8"><title>Relay opening v4</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Relay opening v4 — kinetic, high-colour motion graphics. Deterministic: renderFrame(t) draws time t.
const W=1920,H=1080,cv=document.getElementById('c');let g=cv.getContext('2d');
let CUE={problem:.058,fail:2.032,teamchat:4.656,harborcloud:9.091,ownership:12.98,manual:16.405,relay:22.837,agentOwn:25.902,approval:28.618,delivery:31.509,transition:34.818,end:35.805};
window.setCues=c=>{CUE={...CUE,...c}};

// ---------- maths ----------
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, P=(t,s,d)=>clamp((t-s)/d), lerp=(a,b,p)=>a+(b-a)*p;
const oc=p=>1-Math.pow(1-clamp(p),3);
const ioc=p=>{p=clamp(p);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
const ob=(p,s=1.70158)=>{p=clamp(p);const c3=s+1;return 1+c3*Math.pow(p-1,3)+s*Math.pow(p-1,2)};
const obo=p=>{p=clamp(p);const n=7.5625,d=2.75;if(p<1/d)return n*p*p;if(p<2/d)return n*(p-=1.5/d)*p+.75;if(p<2.5/d)return n*(p-=2.25/d)*p+.9375;return n*(p-=2.625/d)*p+.984375};
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function R(seed){let s=(seed>>>0)||1;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgba=(h,a=1)=>{const[r,gg,b]=hex(h);return`rgba(${r},${gg},${b},${clamp(a)})`};
const mix=(a,b,p)=>{const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(p))).toString(16).padStart(2,'0')).join('')};
const C={blue:'#3D5BFF',cyan:'#22E1FF',violet:'#9B5CFF',magenta:'#FF4FD8',coral:'#FF5E62',yellow:'#FFD447',mint:'#4DF0B0',white:'#FFFFFF',soft:'#D3DDFF',ink:'#0B1030'};
const FONT='"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif', F=(w,s)=>`${w} ${s}px ${FONT}`;

// ---------- primitives ----------
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function fillRR(x,y,w,h,r,fill){rr(x,y,w,h,r);g.fillStyle=fill;g.fill()}
function circ(x,y,r){g.beginPath();g.arc(x,y,Math.max(0,r),0,Math.PI*2)}
function dot(x,y,r,fill){circ(x,y,r);g.fillStyle=fill;g.fill()}
function ring(x,y,r,col,w){circ(x,y,r);g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function glow(x,y,r,col,a=.5){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgba(col,a));gr.addColorStop(1,rgba(col,0));g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
function withT(x,y,s,rot,fn,alpha=1){if(alpha<=.001||Math.abs(s)<=.0001)return;g.save();g.globalAlpha*=clamp(alpha);g.translate(x,y);if(rot)g.rotate(rot);g.scale(s,s);fn();g.restore()}
function txt(s,x,y,font,fill,align='left',base='alphabetic'){g.font=font;g.textAlign=align;g.textBaseline=base;g.fillStyle=fill;g.fillText(s,x,y)}
function tw(s,font){g.font=font;return g.measureText(s).width}
function check(x,y,s,col,w){g.beginPath();g.moveTo(x-s*.5,y);g.lineTo(x-s*.12,y+s*.38);g.lineTo(x+s*.55,y-s*.4);g.strokeStyle=col;g.lineWidth=w||s*.18;g.lineCap='round';g.lineJoin='round';g.stroke()}
function cross(x,y,s,col,w){g.beginPath();g.moveTo(x-s,y-s);g.lineTo(x+s,y+s);g.moveTo(x+s,y-s);g.lineTo(x-s,y+s);g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.stroke()}
function bez(a,b,c,d,p){const q=1-p;return{x:q*q*q*a.x+3*q*q*p*b.x+3*q*p*p*c.x+p*p*p*d.x,y:q*q*q*a.y+3*q*q*p*b.y+3*q*p*p*c.y+p*p*p*d.y}}
function quad(a,c,b,p){const q=1-p;return{x:q*q*a.x+2*q*p*c.x+p*p*b.x,y:q*q*a.y+2*q*p*c.y+p*p*b.y}}
function pill(label,cx,cy,font,bgc,fg,padX=28,h=60){const w=tw(label,font)+padX*2;fillRR(cx-w/2,cy-h/2,w,h,h/2,bgc);txt(label,cx,cy+1,font,fg,'center','middle');return w}
function star(x,y,r,col){g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,q=i%2?r*.38:r;g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}g.closePath();g.fillStyle=col;g.fill()}
function shadowed(col,blur,fn,dy=0){g.save();g.shadowColor=col;g.shadowBlur=blur;g.shadowOffsetY=dy;fn();g.restore()}

// ---------- background ----------
const PAL={
 hook:{a:'#050820',b:'#150C42',blobs:[C.blue,C.violet,C.magenta,C.cyan],k:.34},
 fail:{a:'#16061F',b:'#330A33',blobs:[C.coral,C.magenta,'#7A2BFF','#FF8A3D'],k:.36},
 team:{a:'#1532E8',b:'#5A1FCF',blobs:[C.cyan,C.magenta,'#7A5CFF','#3DA8FF'],k:.36},
 harbor:{a:'#0848C2',b:'#2A1490',blobs:[C.cyan,C.mint,'#3D5BFF',C.magenta],k:.36},
 split:{a:'#0B0830',b:'#270B4E',blobs:[C.blue,C.violet,C.magenta,C.cyan],k:.32},
 chaos:{a:'#1A082E',b:'#3D0B3E',blobs:[C.yellow,C.coral,C.cyan,C.magenta],k:.28},
 relay:{a:'#0B0734',b:'#2D0E6E',blobs:[C.cyan,C.violet,C.magenta,C.blue],k:.36},
 win:{a:'#04283A',b:'#152E70',blobs:[C.mint,C.cyan,C.yellow,C.violet],k:.34},
 end:{a:'#3550FF',b:'#B83CF0',blobs:[C.cyan,C.magenta,C.yellow,'#7A5CFF'],k:.4},
};
const palMix=(A,B,p)=>({a:mix(A.a,B.a,p),b:mix(A.b,B.b,p),blobs:A.blobs.map((c,i)=>mix(c,B.blobs[i],p)),k:lerp(A.k,B.k,p)});
function bg(t,pal){
 const gr=g.createLinearGradient(0,0,W*.45,H);gr.addColorStop(0,pal.a);gr.addColorStop(1,pal.b);g.fillStyle=gr;g.fillRect(-60,-60,W+120,H+120);
 g.save();g.globalCompositeOperation='lighter';
 pal.blobs.forEach((c,i)=>{const x=W*(.5+.42*Math.sin(t*.27*(1+i*.31)+i*1.7)),y=H*(.5+.4*Math.cos(t*.22*(1+i*.27)+i*2.3));glow(x,y,640+140*Math.sin(t*.5+i),c,pal.k)});
 g.restore();
 for(let i=0;i<80;i++){const x=(hash(i)*W+t*(14+hash(i+9)*34))%W,y=((hash(i+3)*H-t*(8+hash(i+5)*22))%H+H)%H;const f=.3+.7*Math.abs(Math.sin(t*1.6+i));dot(x,y,1+hash(i+7)*2.4,`rgba(255,255,255,${.16*f})`)}
}

// ---------- effects ----------
const off=document.createElement('canvas');off.width=W;off.height=H;const og=off.getContext('2d');
const tnt=document.createElement('canvas');tnt.width=W;tnt.height=H;const tg=tnt.getContext('2d');
function glitchLayer(fn,amt,t){
 if(amt<.01){fn();return}
 og.setTransform(1,0,0,1,0,0);og.clearRect(0,0,W,H);const keep=g;g=og;fn();g=keep;
 const f=Math.floor(t*24);
 [[C.coral,-1],[C.cyan,1]].forEach(([col,s])=>{tg.globalCompositeOperation='source-over';tg.clearRect(0,0,W,H);tg.drawImage(off,0,0);tg.globalCompositeOperation='source-in';tg.fillStyle=col;tg.fillRect(0,0,W,H);g.save();g.globalAlpha*=.8;g.globalCompositeOperation='lighter';g.drawImage(tnt,s*amt*26,s*amt*4);g.restore()});
 g.save();g.globalAlpha*=1-amt*.25;g.drawImage(off,0,0);g.restore();
 for(let k=0;k<9;k++){const y0=hash(f*7+k)*H*.6,h=14+hash(f*3+k)*70,dx=(hash(f*11+k)-.5)*amt*190;g.drawImage(off,0,y0,W,h,dx,y0,W,h)}
}
function shock(t,t0,x,y,col,max=900,d=.7,w=10){const p=P(t,t0,d);if(p<=0||p>=1)return;ring(x,y,oc(p)*max,rgba(col,1-p),w*(1-p)+1)}
function rays(t,x,y,n,col,a,len=1700){if(a<=.003)return;g.save();g.translate(x,y);g.rotate(t*.22);g.globalCompositeOperation='lighter';for(let i=0;i<n;i++){g.rotate(Math.PI*2/n);const gr=g.createLinearGradient(0,0,len,0);gr.addColorStop(0,rgba(col,a));gr.addColorStop(1,rgba(col,0));g.fillStyle=gr;g.beginPath();g.moveTo(0,0);g.lineTo(len,-len*.06);g.lineTo(len,len*.06);g.closePath();g.fill()}g.restore()}
function confetti(t,t0,x,y,n,seed,o={}){
 const{spread=Math.PI*2,dir=-Math.PI/2,speed=[500,1300],grav=1300,life=2.2,cols=[C.cyan,C.magenta,C.yellow,C.mint,C.violet,C.coral]}=o;
 const dt=t-t0;if(dt<0||dt>life)return;const r=R(seed);
 for(let i=0;i<n;i++){const a=dir+(r()-.5)*spread,sp=lerp(speed[0],speed[1],r()),col=cols[Math.floor(r()*cols.length)],sz=9+r()*13,spin=(r()-.5)*14,kind=r(),wob=r()*6;
  const k=1.4,drag=1-Math.exp(-dt*k);const px=x+Math.cos(a)*sp*drag/k+Math.sin(dt*4+wob)*12,py=y+Math.sin(a)*sp*drag/k+.5*grav*dt*dt*.55;
  withT(px,py,1,spin*dt,()=>{g.fillStyle=col;if(kind<.5){g.scale(1,Math.cos(dt*8+wob));g.fillRect(-sz/2,-sz/4,sz,sz/2)}else if(kind<.78){circ(0,0,sz/3);g.fill()}else star(0,0,sz*.6,col)},clamp((life-dt)/.7))}
}
function trail(t,tStart,dur,posAt,col,ease=ioc,n=26){for(let i=0;i<n;i++){const age=i*.03,tt=t-age,p=(tt-tStart)/dur;if(p<0||p>1)continue;const q=posAt(ease(p));const fr=Math.floor(t*24);const a=1-i/n;star(q.x+(hash(i*3+fr)-.5)*34,q.y+(hash(i*5+fr+1)-.5)*34,10*a+2,rgba(i%3?col:'#ffffff',a*.9))}}
function beam(t,x1,x2,y,col,prog,amp=12){
 if(prog<=0)return;const xe=lerp(x1,x2,prog),pts=[],dir=Math.sign(x2-x1)||1;
 for(let x=x1;dir>0?x<=xe:x>=xe;x+=8*dir){const u=(x-x1)/(x2-x1);pts.push([x,y+Math.sin(x*.025-t*7)*amp*Math.sin(u*Math.PI)])}
 g.save();g.lineCap='round';g.globalCompositeOperation='lighter';
 [[26,.14],[12,.32],[4,1]].forEach(([w,a])=>{g.beginPath();pts.forEach(([x,yy],i)=>i?g.lineTo(x,yy):g.moveTo(x,yy));g.strokeStyle=a===1?'rgba(255,255,255,.9)':rgba(col,a);g.lineWidth=w;g.stroke()});g.restore();
 for(let i=0;i<5;i++){const u=(t*.6+i/5)%1;if(u>prog)continue;const x=lerp(x1,x2,u),yy=y+Math.sin(x*.025-t*7)*amp*Math.sin(u*Math.PI);glow(x,yy,34,col,.9);dot(x,yy,6,'#fff')}
}
function iris(t,t0,d,x,y,col,drawOld,drawNew){
 const p=P(t,t0,d);if(p<=0){drawOld();return}if(p>=1){drawNew();return}
 drawOld();const r=oc(p)*2400;g.save();circ(x,y,r);g.clip();drawNew();g.restore();
 ring(x,y,r,col,46*(1-p)+6);ring(x,y,r-34,'rgba(255,255,255,.7)',5*(1-p)+1);
}
function slab(t,t0,d,col,drawOld,drawNew){
 const p=P(t,t0,d);if(p<=0){drawOld();return}if(p>=1){drawNew();return}
 const x=lerp(-500,W+700,ioc(p));
 drawNew();g.save();g.beginPath();g.moveTo(x+220,-80);g.lineTo(W+500,-80);g.lineTo(W+500,H+80);g.lineTo(x-220,H+80);g.closePath();g.clip();drawOld();g.restore();
 g.save();g.beginPath();g.moveTo(x+220,-80);g.lineTo(x+40,-80);g.lineTo(x-400,H+80);g.lineTo(x-220,H+80);g.closePath();
 const gr=g.createLinearGradient(x-400,0,x+220,0);gr.addColorStop(0,C.yellow);gr.addColorStop(.5,col);gr.addColorStop(1,C.cyan);g.fillStyle=gr;g.shadowColor=rgba(col,.9);g.shadowBlur=70;g.fill();g.restore();
}
function shake(t){
 let x=0,y=0;const hits=[[CUE.fail,24,.55],[CUE.ownership+.2+.65/2.75,28,.55],[CUE.manual+.1,12,.35],[CUE.manual+.6,12,.35],[CUE.relay,20,.6]];
 for(const[s,a,d]of hits){const p=(t-s)/d;if(p>=0&&p<1){const e=a*Math.pow(1-p,2);x+=Math.sin(t*93+s)*e;y+=Math.cos(t*71+s*2)*e}}
 const ten=t<CUE.relay?P(t,CUE.manual+3,CUE.relay-CUE.manual-3):0;x+=Math.sin(t*61)*ten*5;y+=Math.cos(t*53)*ten*4;return{x,y};
}

// ---------- type ----------
function words(list,x,y,size,start,t,o={}){
 const font=F(o.w||800,size);let cx=x;const gap=size*.26,st=o.stagger??.12;
 list.forEach((wd,i)=>{const w=tw(wd.s,font),p=P(t,start+i*st,o.dur||.55);
  if(p>0){const sc=o.slam?lerp(2,1,oc(p)):ob(p),dy=o.slam?0:(1-oc(p))*size*.5;
   withT(cx+w/2,y-size*.35+dy,sc,(1-oc(p))*(o.rot||0),()=>{let fill=wd.fill||C.white;if(Array.isArray(fill)){const gr=g.createLinearGradient(-w/2,0,w/2,0);fill.forEach((c,j)=>gr.addColorStop(j/(fill.length-1),c));fill=gr}
    g.shadowColor='rgba(0,0,30,.4)';g.shadowBlur=34;g.shadowOffsetY=12;txt(wd.s,-w/2,size*.35,font,fill)},clamp(p*2.5))}
  cx+=w+gap});return cx;
}
function letters(str,x,y,size,start,t,fill){
 const font=F(800,size);let cx=x;
 for(let i=0;i<str.length;i++){const ch=str[i],w=tw(ch,font),p=P(t,start+i*.045,.5);
  if(p>0)withT(cx+w/2,y-size*.3-(1-ob(p,2.2))*size*.9,1,(1-oc(p))*.5,()=>{g.shadowColor='rgba(0,0,30,.35)';g.shadowBlur=26;g.shadowOffsetY=10;txt(ch,0,size*.3,font,fill,'center')},clamp(p*3));cx+=w}
}

// ---------- props ----------
function personIcon(x,y,r,col,fg='#fff'){dot(x,y,r,col);g.save();circ(x,y,r);g.clip();dot(x,y-r*.2,r*.36,fg);circ(x,y+r*.95,r*.68);g.fillStyle=fg;g.fill();g.restore()}
function avatar(x,y,r,col,s=1,alpha=1){withT(x,y,s,0,()=>{glow(0,0,r*2.3,col,.4);shadowed(rgba(col,.7),34,()=>dot(0,0,r,col));ring(0,0,r,'rgba(255,255,255,.85)',4);personIcon(0,0,r-7,mix(col,'#0B1030',.15))},alpha)}
function bubbleIcon(x,y,s,col,dotc){g.beginPath();g.roundRect(x-s,y-s*.75,s*2,s*1.4,s*.4);g.moveTo(x-s*.5,y+s*.6);g.lineTo(x-s*.75,y+s*1.05);g.lineTo(x-s*.02,y+s*.62);g.fillStyle=col;g.fill();for(let i=-1;i<=1;i++)dot(x+i*s*.5,y-s*.05,s*.15,dotc)}
function msgCard(label,fill,fg,font=F(700,30),icon=true){
 const w=tw(label,font)+(icon?112:64),h=80;
 shadowed('rgba(0,0,25,.4)',34,()=>{g.beginPath();g.roundRect(-w/2,-h/2,w,h,26);g.moveTo(-w/2+30,h/2-2);g.lineTo(-w/2+16,h/2+24);g.lineTo(-w/2+60,h/2-2);g.fillStyle=fill;g.fill()},12);
 if(icon)bubbleIcon(-w/2+48,0,19,fg,fill);txt(label,-w/2+(icon?84:32),2,font,fg,'left','middle');return w;
}
function phone(t,state='idle'){
 const w=300,h=560;shadowed('rgba(0,0,30,.5)',60,()=>fillRR(-w/2,-h/2,w,h,48,'#0C1236'),30);
 rr(-w/2,-h/2,w,h,48);g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=3;g.stroke();
 const sx=-w/2+14,sy=-h/2+14,sw=w-28,sh=h-28;
 g.save();rr(sx,sy,sw,sh,36);g.clip();g.fillStyle='#F4F7FF';g.fillRect(sx,sy,sw,sh);
 const hg=g.createLinearGradient(sx,0,sx+sw,0);hg.addColorStop(0,C.blue);hg.addColorStop(1,C.violet);g.fillStyle=hg;g.fillRect(sx,sy,sw,100);
 fillRR(-50,sy+10,100,18,9,'#0C1236');
 bubbleIcon(sx+42,sy+66,20,'#fff',C.blue);txt('TeamChat',sx+72,sy+75,F(700,26),'#fff');
 personIcon(0,sy+175,44,state==='waiting'?C.coral:C.blue);
 txt(state==='waiting'?'Waiting for your message…':'Online',0,sy+255,F(600,19),'#5A6390','center');
 for(let i=0;i<3;i++)fillRR(sx+30,sy+292+i*38,sw-60-(i==2?70:0),18,9,'#DCE3FA');
 for(let i=0;i<3;i++){const a=.3+.7*Math.max(0,Math.sin(t*6-i*.8));dot(-26+i*26,sy+sh-50,8,rgba(state==='waiting'?C.coral:C.blue,a))}
 g.restore();
}
function cloudShape(){
 const parts=[[-150,30,95],[-60,-40,122],[62,-22,110],[152,35,85],[0,40,110]];
 shadowed(rgba(C.cyan,.8),90,()=>{const gr=g.createLinearGradient(0,-170,0,130);gr.addColorStop(0,'#FFFFFF');gr.addColorStop(1,'#7FEBFF');g.fillStyle=gr;g.save();g.beginPath();g.rect(-300,-300,600,425);g.clip();g.beginPath();parts.forEach(([x,y,r])=>{g.moveTo(x+r,y);g.arc(x,y,r,0,Math.PI*2)});g.rect(-150,30,300,95);g.fill();g.restore()});
}
function rack(x,y,w,t,i){fillRR(x,y,w,48,14,'rgba(8,18,60,.8)');rr(x,y,w,48,14);g.strokeStyle=rgba(C.cyan,.7);g.lineWidth=2;g.stroke();
 for(let k=0;k<3;k++){const on=Math.sin(t*(4+k+i)+k*2+i*3)>-.2;dot(x+28+k*26,y+24,7,on?[C.mint,C.cyan,C.yellow][k]:'rgba(255,255,255,.2)');if(on)glow(x+28+k*26,y+24,20,[C.mint,C.cyan,C.yellow][k],.6)}
 fillRR(x+120,y+20,w-170,8,4,'rgba(255,255,255,.25)');fillRR(x+120,y+20,(w-170)*(.5+.5*Math.sin(t*2+i)),8,4,C.cyan)}
function robot(t,col,off){
 const pulse=.5+.5*Math.sin(t*3+off);glow(0,0,320,col,.38);ring(0,0,152+pulse*16,rgba(col,.4),3);dot(0,0,130,rgba(col,.17));ring(0,0,130,col,4);
 g.strokeStyle=col;g.lineWidth=8;g.lineCap='round';g.beginPath();g.moveTo(0,-72);g.lineTo(0,-106);g.stroke();glow(0,-116,44,col,.9);dot(0,-116,13,'#fff');
 shadowed(rgba(col,.85),44,()=>fillRR(-92,-74,184,148,46,col));fillRR(-66,-44,132,80,26,C.ink);
 const bl=((t+off)%2.8)<.12?.12:1;[-30,30].forEach(dx=>{glow(dx,-6,32,col,.7);g.save();g.translate(dx,-6);g.scale(1,bl);dot(0,0,13,'#fff');g.restore()});
 g.strokeStyle=col;g.lineWidth=6;g.beginPath();g.arc(0,10,16,.18*Math.PI,.82*Math.PI);g.stroke();
}
function lock(s,col,hole=C.ink){g.save();g.scale(s,s);g.translate(0,-8);g.strokeStyle=col;g.lineWidth=10;g.lineCap='round';g.beginPath();g.moveTo(-20,4);g.lineTo(-20,-10);g.arc(0,-10,20,Math.PI,0);g.lineTo(20,4);g.stroke();fillRR(-30,0,60,46,10,col);dot(0,20,7,hole);g.restore()}
function cursor(){g.beginPath();g.moveTo(0,0);g.lineTo(0,46);g.lineTo(12,35);g.lineTo(22,56);g.lineTo(30,52);g.lineTo(20,32);g.lineTo(36,32);g.closePath();g.fillStyle='#fff';g.fill();g.strokeStyle=C.ink;g.lineWidth=4;g.lineJoin='round';g.stroke()}
